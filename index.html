<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maxe - Study Hub</title>
    <meta name="theme-color" content="#2D4A3E" />
    <meta name="description" content="Your college study hub for PDFs, Notes, Question Papers, AI Chats, Communities and more." />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maxe" />
    <!-- Explicit SW registration for PWABuilder detection & Auto-Update -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('SW registered:', reg.scope);
            
            // Periodically check for updates every 10 mins if app is left open
            setInterval(() => { reg.update(); }, 10 * 60 * 1000);
            
          }).catch(function(err) {
            console.log('SW registration failed:', err);
          });

          // When a new SW takes over (thanks to skipWaiting in sw.js), reload the page once automatically
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
